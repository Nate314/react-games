services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Runs the e2e suite against `web`, with no local Node/Playwright install needed.
  # Opt-in (profile "test"): `docker compose --profile test run --rm --build e2e`.
  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web:8080
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    profiles: ["test"]
